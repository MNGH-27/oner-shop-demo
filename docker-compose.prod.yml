name: oner-shop

services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: oner_shop
      POSTGRES_USER: oner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oner -d oner_shop"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [oner]

  api:
    image: ${IMAGE_PREFIX:-oner-shop}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://oner:${POSTGRES_PASSWORD}@database:5432/oner_shop?schema=public
      PORT: 5000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/apps/shop-backend/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [oner]

  store:
    image: ${IMAGE_PREFIX:-oner-shop}/store:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.store
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
        NEXT_PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL:?PUBLIC_MEDIA_URL is required}
        NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "false"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:3000"
    networks: [oner]

  admin:
    image: ${IMAGE_PREFIX:-oner-shop}/admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
        VITE_MEDIA_BASE_URL: ${PUBLIC_MEDIA_URL:?PUBLIC_MEDIA_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks: [oner]

networks:
  oner:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
